name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and validators
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest ruff check-jsonschema

      - name: Lint Python
        run: ruff check collector tests

      - name: Run tests
        run: python -m pytest -q

      - name: Validate JSON data against schemas
        run: |
          check-jsonschema --schemafile schemas/articles.schema.json data/articles.json
          check-jsonschema --schemafile schemas/state.schema.json data/state.json
