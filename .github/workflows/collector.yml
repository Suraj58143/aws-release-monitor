name: Collect AWS announcements

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collector-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Collect, normalize, and store announcements
        run: python -m collector.fetch

      - name: Commit updated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json data/state.json
          if git diff --cached --quiet; then
            echo "No dataset changes to commit."
          else
            git commit -m "chore: update AWS announcements"
            for attempt in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi

              if [ "$attempt" -eq 3 ]; then
                echo "::error::Could not push the collector commit after three attempts."
                exit 1
              fi

              echo "Remote branch advanced during collection; rebasing and merging the latest feed results (attempt $attempt)."
              git fetch origin "$GITHUB_REF_NAME"
              git rebase --strategy-option=theirs "origin/${GITHUB_REF_NAME}"
              python -m collector.fetch
              git add data/articles.json data/state.json
              if ! git diff --cached --quiet; then
                git commit --amend --no-edit
              fi
            done
          fi

      - name: Build Pages site
        run: python -m collector.build_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    if: github.repository_visibility == 'public' || vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
